<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labirinto IA-Simbólica</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Labirinto 10x10</h1>
    <div id="container">
        <div id="labirinto"></div>
        <div id="info">
            <h3>Movimentos</h3>
            <div class="movements-wrapper">
                <ul id="movimentos"></ul>
            </div>
            <p>Energia Restante: <span id="energia">50</span></p>
            <p>Total de Movimentos: <span id="total-movimentos">0</span></p>
        </div>
    </div>
    <div class="controls">
        <label for="algoritmo">Algoritmo de busca:</label>
        <select id="algoritmo">
            <option value="bfs">Busca em largura (BFS)</option>
            <option value="astar">A*</option>
        </select>
        <button onclick="gerarLabirinto()">Gerar Novo Labirinto</button>
    </div>
    <p id="status" aria-live="polite"></p>

    <script src="js/main.js" defer></script>
    <script src="js/maze.js" defer></script>
    <script src="js/pathFinding.js" defer></script>
    <script src="js/energy.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/animation.js" defer></script>

</body>
</html>
